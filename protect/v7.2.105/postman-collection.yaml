- id: 55b56974-6f43-461d-8a35-3c1a75755618
  name: Point of sale event ingestion
  description:
    content: ''
    type: text/plain
  item:
  - id: a0104890-389d-4766-b15a-151071eb1d52
    name: Ingest a POS transaction
    request:
      name: Ingest a POS transaction
      description:
        content: 'Records a point of sale transaction as a camera event so the transaction
          details can be overlaid on recorded footage. Requires write access to the
          target camera. Footage capture is best-effort: the overlay only appears
          where the target camera was recording the transaction window (e.g. cameras
          in detections or adaptive recording modes), and a backdated timestamp may
          fall outside retained footage. A 200 response confirms the event was recorded,
          not that video exists for the window.'
        type: text/plain

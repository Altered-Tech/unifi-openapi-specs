  - id: f691c8d9-4d31-4632-95ad-2baa11793e2e
    name: Get Latest Adopted Device Statistics
    request:
      name: Get Latest Adopted Device Statistics
      description:
        content: Retrieve the latest real-time statistics of a specific adopted device,
          such as uptime, data transmission rates, CPU and memory utilization.
        type: text/plain
      url:
        path:
        - v1
        - sites
        - :siteId
        - devices
        - :deviceId
        - statistics
        - latest
        host:
        - '{{baseUrl}}'
        query: []
        variable:
        - disabled: false
          type: any

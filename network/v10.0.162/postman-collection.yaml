- id: 2816703c-d9d0-4fa7-9ca7-50ded8536315
  name: Application Info
  description:
    content: 'Returns general details about the UniFi Network application,

      including version and runtime metadata. Useful for integration validation.'
    type: text/plain
  item:
  - id: ed4c4fa9-cfe5-46a5-9ad5-00a3297d064e
    name: Get Application Info
    request:
      name: Get Application Info
      description:
        content: Retrieve general information about the UniFi Network application.
        type: text/plain
      url:
        path:
        - v1
        - info
        host:
        - '{{baseUrl}}'
        query: []
        variable:
        - description: ID of the console to proxy requests to
          type: any
          value: '{{consoleId}}'
          key: consoleId
      header:
      - key: Accept
        value: application/json
      method: GET
      auth: null
    response:
    - id: f6bd0d61-2eaf-4461-b044-88f95a61b9d3
      name: OK
      originalRequest:
        url:
          path:
          - v1
          - info
          host:
          - '{{baseUrl}}'
          query: []
          variable:
          - description: ID of the console to proxy requests to
            type: any
            value: '{{consoleId}}'
            key: consoleId
        header:
        - key: Accept
          value: application/json
        method: GET
        body: {}
      status: OK
      code: 200
      header:
      - key: Content-Type
        value: application/json
      body: "{\n  \"applicationVersion\": \"9.1.0\"\n}"
      cookie: []
      _postman_previewlanguage: json
    event: []
    protocolProfileBehavior:
      disableBodyPruning: true

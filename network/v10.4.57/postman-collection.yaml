- id: 4346acff-d493-4b8a-aaef-12e4563fcb4b
  name: Sites
  description:
    content: 'Endpoints for listing and managing UniFi sites within a local Network
      application.

      Site ID is required for most other API requests.'
    type: text/plain
  item:
  - id: 17359a2e-54bf-42c6-a7d8-13ff28c40d09
    name: List Local Sites
    request:
      name: List Local Sites
      description:
        content: 'Retrieve a paginated list of local sites managed by this Network
          application.

          Site ID is required for other UniFi Network API calls.


          <details>

          <summary>Filterable properties (click to expand)</summary>


          |Name|Type|Allowed functions|

          |-|-|-|

          |`id`|`UUID`|`eq` `ne` `in` `notIn`|

          |`internalReference`|`STRING`|`eq` `ne` `in` `notIn`|

          |`name`|`STRING`|`eq` `ne` `in` `notIn`|

          </details>'
        type: text/plain
      url:
        path:
        - v1
        - sites
        host:
        - '{{baseUrl}}'
        query:
        - disabled: false
          key: offset
          value: '0'
        - disabled: false
          key: limit
          value: '25'
        - disabled: false
          key: filter
          value: <string>
        variable:
        - description: ID of the console to proxy requests to
          type: any
          value: '{{consoleId}}'
          key: consoleId
      header:
      - key: Accept
        value: application/json
      method: GET
      auth: null
    response:
    - id: 612ed909-becd-4064-b4b3-69603b548dec
      name: OK
      originalRequest:
        url:
          path:
          - v1
          - sites
          host:
          - '{{baseUrl}}'
          query:
          - key: offset
            value: '0'
          - key: limit
            value: '25'
          - key: filter
            value: <string>
          variable:
          - description: ID of the console to proxy requests to
            type: any
            value: '{{consoleId}}'
            key: consoleId
        header:
        - key: Accept
          value: application/json
        method: GET
        body: {}
      status: OK
      code: 200
      header:
      - key: Content-Type
        value: application/json
      body: "{\n  \"count\": 10,\n  \"data\": [\n    {\n      \"id\": \"8bc8ef1c-03a7-db1b-6b58-0475e2e0dd8d\"\
        ,\n      \"internalReference\": \"string\",\n      \"name\": \"string\"\n\
        \    },\n    {\n      \"id\": \"6ecf36c7-e851-9d82-abb8-2e3da101743b\",\n\
        \      \"internalReference\": \"string\",\n      \"name\": \"string\"\n  \

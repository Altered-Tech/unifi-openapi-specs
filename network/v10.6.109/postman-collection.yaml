- id: 93ce82ec-c91d-4e83-ae11-93059cbc3913
  name: Sites
  description:
    content: 'Endpoints for listing and managing UniFi sites within a local Network
      application.

      Site ID is required for most other API requests.'
    type: text/plain
  item:
  - id: c3c3e5c7-f01b-487b-98ad-4a36e96a2170
    name: List Local Sites
    request:
      name: List Local Sites
      description:
        content: 'Retrieve a paginated list of local sites managed by this Network
          application.

          Site ID is required for other UniFi Network API calls.


          <details>

          <summary>Filterable properties (click to expand)</summary>


          |Name|Type|Allowed functions|

          |-|-|-|

          |`id`|`UUID`|`eq` `ne` `in` `notIn`|

          |`internalReference`|`STRING`|`eq` `ne` `in` `notIn`|

          |`name`|`STRING`|`eq` `ne` `in` `notIn`|

          </details>'
        type: text/plain
      url:
        path:
        - v1
        - sites
        host:
        - '{{baseUrl}}'
        query:
        - disabled: false
          key: offset
          value: '0'
        - disabled: false
          key: limit
          value: '25'
        - disabled: false
          key: filter
          value: <string>
        variable:
        - description: ID of the console to proxy requests to
          type: any
          value: '{{consoleId}}'
          key: consoleId
      header:
      - key: Accept
        value: application/json
      method: GET
      auth: null
    response:
    - id: dbf800ff-338b-464a-8864-94b14de184fa
      name: OK
      originalRequest:
        url:
          path:
          - v1
          - sites
          host:
          - '{{baseUrl}}'
          query:
          - key: offset
            value: '0'
          - key: limit
            value: '25'
          - key: filter
            value: <string>
          variable:
          - description: ID of the console to proxy requests to
            type: any
            value: '{{consoleId}}'
            key: consoleId
        header:
        - key: Accept
          value: application/json
        method: GET
        body: {}
      status: OK
      code: 200
      header:
      - key: Content-Type
        value: application/json
      body: "{\n  \"count\": 10,\n  \"data\": [\n    {\n      \"id\": \"b8e019e5-c7fc-d66e-bb76-a11a317c6092\"\

            value: '0'
          - key: limit
            value: '25'
          - key: filter
            value: <string>
          variable:
          - disabled: false
            type: any
            value: <uuid>
            key: siteId
            description: '(Required) '
          - description: ID of the console to proxy requests to
            type: any
            value: '{{consoleId}}'
            key: consoleId
        header:
        - key: Accept
          value: application/json
        method: GET
        body: {}
      status: OK
      code: 200
      header:
      - key: Content-Type
        value: application/json
      body: "{\n  \"count\": 10,\n  \"data\": [\n    {\n      \"features\": [\n  \
        \      \"switching\",\n        \"gateway\"\n      ],\n      \"firmwareUpdatable\"\
        : true,\n      \"id\": \"32897fa7-2295-302e-e35d-f5c93047ac63\",\n      \"\
        interfaces\": [\n        \"radios\",\n        \"ports\"\n      ],\n      \"\

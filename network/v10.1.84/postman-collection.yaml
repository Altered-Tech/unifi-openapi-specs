- id: a1b4ab1f-0b48-4926-a950-d60f6dd17cb7
  name: Application Info
  description:
    content: 'Returns general details about the UniFi Network application,

      including version and runtime metadata. Useful for integration validation.'
    type: text/plain
  item:
  - id: 780837a8-569c-4576-98a5-26f1a037dcb7
    name: Get Application Info
    request:
      name: Get Application Info
      description:
        content: Retrieve general information about the UniFi Network application.
        type: text/plain
      url:
        path:
        - v1
        - info
        host:
        - '{{baseUrl}}'
        query: []
        variable:
        - description: ID of the console to proxy requests to
          type: any
          value: '{{consoleId}}'
          key: consoleId
      header:
      - key: Accept
        value: application/json
      method: GET
      auth: null
    response:
    - id: 2cdacb7a-6bc3-4c02-982d-2e7c80e49f34
      name: OK
      originalRequest:
        url:
          path:
          - v1
          - info
          host:
          - '{{baseUrl}}'
          query: []
          variable:
          - description: ID of the console to proxy requests to
            type: any
            value: '{{consoleId}}'
            key: consoleId
        header:
        - key: Accept
          value: application/json
        method: GET
        body: {}
      status: OK
      code: 200
      header:
      - key: Content-Type
        value: application/json
      body: "{\n  \"applicationVersion\": \"9.1.0\"\n}"
      cookie: []
      _postman_previewlanguage: json
    event: []
    protocolProfileBehavior:
      disableBodyPruning: true

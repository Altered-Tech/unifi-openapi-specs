          are not supported<br/><br/>**API Documentation**: <br/>- Network API: [https://developer.ui.com/network](https://developer.ui.com/network)<br/>-
          Protect API: [https://developer.ui.com/protect](https://developer.ui.com/protect)<br/>-
          InnerSpace API: [https://developer.ui.com/innerspace](https://developer.ui.com/innerspace)<br/><br/>**Examples**:
          <br/>- Network: `GET /v1/connector/consoles/{id}/network/integration/v1/sites`
          retrieves network sites<br/>- Protect: `GET /v1/connector/consoles/{id}/protect/integration/v1/meta/info`
          retrieves protect application info<br/><br/>**Response**: On success, the
          upstream API response is passed through directly. On error, a standardized
